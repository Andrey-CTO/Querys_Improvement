            return { __html: html };
        };

        // --- INDEXED DB ---
        const IDB_DB_NAME = 'TR_Workspace_DB';
        const IDB_STORE_NAME = 'handles';

        const getDB = () => new Promise((resolve, reject) => {
            const req = indexedDB.open(IDB_DB_NAME, 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE_NAME);
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
        });

        const saveHandle = async (handle) => {
            const db = await getDB();
            const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
            tx.objectStore(IDB_STORE_NAME).put(handle, 'workspaceHandle');
            return new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = reject; });
        };

        const loadHandle = async () => {
            const db = await getDB();
            const tx = db.transaction(IDB_STORE_NAME, 'readonly');
            const req = tx.objectStore(IDB_STORE_NAME).get('workspaceHandle');
            return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = reject; });
        };

        const clearHandle = async () => {
             const db = await getDB();
             const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
             tx.objectStore(IDB_STORE_NAME).delete('workspaceHandle');
        };

                    details: `### 🎯 Objetivo

### 🧠 Paso a Paso y Explicación

2. **ORDER BY:** Ordena tu resultado. Usa \`ASC\` (menor a mayor, a-z) o \`DESC\` (mayor a menor, z-a).
3. **DISTINCT:** Se coloca justo después de SELECT. Elimina las filas repetidas. Si 5 clientes viven en 'Bogotá', \`SELECT DISTINCT Ciudad\` te mostrará 'Bogotá' una sola vez.

ORDER BY Country ASC;

Aprender a filtrar información *después* de que ya ha sido sumada o contada.

### 🧠 Paso a Paso y Explicación
1. **El Problema del WHERE:** El comando \`WHERE\` filtra las filas *antes* de agruparlas. Por lo tanto, NO puedes poner una función matemática en el WHERE (ej. \`WHERE SUM(Ventas) > 100\` dará error).
2. **La Solución HAVING:** \`HAVING\` se escribe siempre después del \`GROUP BY\`. Filtra el resultado final (Ej. Muéstrame las ciudades cuya SUMA total sea mayor a 100).

### 🛠️ Código de Ejemplo
\`\`\`sql
SELECT Pais, COUNT(ClienteID) as TotalClientes
FROM Clientes
GROUP BY Pais
HAVING COUNT(ClienteID) > 10; -- Solo países con más de 10 clientes
\`\`\`

                    details: `### 🎯 Objetivo Principal
Evolucionar de una optimización basada en "prueba y error" hacia un diagnóstico científico. Aprenderás a entender cómo el motor de bases de datos compila, algebriza y calcula el costo de una consulta antes de ejecutarla.

### 🧠 Explicación de Conceptos Clave

1. **Planes de Ejecución (Execution Plans)**:
   El motor SQL no ejecuta el código tal como lo escribes. Usa un optimizador basado en costos para elegir el camino más barato. Un \`Index Scan\` lee toda la tabla (lento), mientras que un \`Index Seek\` va directamente a la fila a través de un árbol B-Tree (ultra rápido). 
   
2. **Estadísticas y Cardinalidad**:
   Si el motor estima que tu consulta devolverá 1 fila, usará un algoritmo \`Nested Loop\`. Si realmente devuelves 1,000,000 de filas, causará un desbordamiento a disco (*Spill to TempDB*).
   
3. **Tipos de JOINs Físicos**:
   - **Nested Loop**: Ideal para conjuntos pequeños.
   - **Hash Match**: Ideal para tablas grandes sin índices útiles (costoso en RAM).
   - **Merge Join**: El más eficiente para tablas gigantes pre-ordenadas por el mismo índice.

   CROSS APPLY sys.dm_exec_query_plan(plan_handle) 
   ORDER BY AvgCPU DESC;
   \`\`\`

        function useLocalStorage(key, initialValue) {

              return item ? JSON.parse(item) : initialValue;
            } catch (error) {
              return initialValue;
            }
          });

          const setValue = (value) => {
            try {
              const valueToStore = value instanceof Function ? value(storedValue) : value;
              setStoredValue(valueToStore);

            a.download = 'total_report_knowledge_db.json';

            const reader = new FileReader();

                const restoredData = restoreImportedData(data);
                if (restoredData.users) setUsers(restoredData.users);
                if (restoredData.guides) setGuides(restoredData.guides);
                if (restoredData.progress) setProgress(restoredData.progress);

              } catch (err) {
                alert('ERROR CRÍTICO: El archivo seleccionado no tiene un formato JSON válido soportado por el Hub.');

            reader.readAsText(file);

        // --- IMPLEMENTER DASHBOARD (VISTA TIPO LECTOR/GUÍA) ---
        function ImplementerDashboard({ currentUser, guides, progress, setProgress }) {
          const [selectedGuideId, setSelectedGuideId] = useState(guides[0]?.id || null);
          const [expandedPractices, setExpandedPractices] = useState({});
          const [expandedModules, setExpandedModules] = useState({});

          const selectedGuide = useMemo(() => guides.find(g => g.id === selectedGuideId), [guides, selectedGuideId]);

          // Lógica para encontrar la práctica activa (primera que no está completada)
          const activePracticeId = useMemo(() => {
              if (!selectedGuide) return null;
              let firstPending = null;
              for (let m of selectedGuide.modules) {
                  for (let p of m.practices) {
                      const pData = getPracticeData(progress[currentUser.id]?.[selectedGuide.id]?.[p.id]);
                      if (pData.status === 'in_progress') return p.id;
                      if (pData.status === 'pending' && !firstPending) firstPending = p.id;
                  }
              }
              return firstPending;
          }, [selectedGuide, progress, currentUser.id]);

          // NUEVO ENFOQUE: COLAPSO INTELIGENTE Y ANIMADO
          useEffect(() => {
            if (selectedGuide) {
              const modState = {};
              const pracState = {};
              let foundActiveModule = false;

              selectedGuide.modules.forEach(m => {
                  const hasActivePractice = m.practices.some(p => p.id === activePracticeId);
                  
                  // Abrir modulo si tiene la tarea activa
                  if (hasActivePractice) {
                      modState[m.id] = true;
                      foundActiveModule = true;
                  } else {
                      modState[m.id] = false;
                  }

                  m.practices.forEach(p => {
                      // Expandir solo la práctica activa
                      pracState[p.id] = (p.id === activePracticeId);
                  });
              });

              // Si nada está activo (ej. todo completado), abrir al menos el primer modulo
              if (!foundActiveModule && selectedGuide.modules.length > 0) {
                  modState[selectedGuide.modules[0].id] = true;
              }

              setExpandedModules(modState);
              setExpandedPractices(pracState);
            }
          }, [selectedGuideId, activePracticeId]);

          const togglePracticeExpanded = (practiceId) => {
            setExpandedPractices(prev => ({ ...prev, [practiceId]: !prev[practiceId] }));
          };

          const toggleModuleExpanded = (moduleId) => {
            setExpandedModules(prev => ({ ...prev, [moduleId]: !prev[moduleId] }));
          };

          const updatePracticeStatus = (guideId, practiceId, newStatus) => {
            const currentProg = progress[currentUser.id] || {};
            const guideProg = currentProg[guideId] || {};
            const practiceProg = getPracticeData(guideProg[practiceId]);
            
            let newElapsed = practiceProg.elapsed || 0;
            
            if (practiceProg.status === 'in_progress' && practiceProg.lastStartedAt) {
                newElapsed += Date.now() - practiceProg.lastStartedAt;
            }

            setProgress({
              ...progress,
              [currentUser.id]: {
                ...currentProg,
                [guideId]: {
                  ...guideProg,
                  [practiceId]: {
                      status: newStatus,
                      elapsed: newStatus === 'in_progress' ? newElapsed : (newStatus === 'pending' && practiceProg.status === 'completed' ? 0 : newElapsed),
                      lastStartedAt: newStatus === 'in_progress' ? Date.now() : null
                  }
                }
              }
            });
            // El cambio de estado recalcula el activePracticeId automáticamente y activa los hooks de colapso.
          };

          const calculateAdoption = (guide) => {
            if (!guide) return 0;
            let total = 0, completed = 0;
            guide.modules.forEach(m => {
              m.practices.forEach(p => {
                total++;
                const pData = getPracticeData(progress[currentUser.id]?.[guide.id]?.[p.id]);
                if (pData.status === 'completed') completed++;
              });
            });
            return total === 0 ? 0 : Math.round((completed / total) * 100);
          };

          if (guides.length === 0) {
            return (
                <div className="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-500 mt-20 animate-in fade-in">
                    <Icon name="book-open" className="text-7xl mb-6 opacity-20"/> 
                    <p className="text-xl font-bold">No hay contenido de estudio asignado.</p>
                    <p className="text-sm mt-2">El Arquitecto de Datos aún no ha publicado el Master Plan.</p>
                </div>
            );
          }

          const currentAdoption = calculateAdoption(selectedGuide);
          const isFullyCompleted = currentAdoption === 100;

          return (
            <div className="max-w-5xl mx-auto space-y-8 pb-32 animate-in fade-in slide-in-from-bottom-4 duration-500 relative z-10">
              
              {/* Menú de Tabs de Guías Visualmente Atractivo */}
              {guides.length > 1 && (
                <div className="flex gap-4 overflow-x-auto custom-scrollbar pb-3">
                  {guides.map(guide => {
                    const isSelected = selectedGuideId === guide.id;
                    return (
                      <button 
                        key={guide.id}
                        onClick={() => setSelectedGuideId(guide.id)}
                        className={`flex-shrink-0 px-6 py-4 rounded-2xl border transition-all duration-300 font-bold hover:-translate-y-1 hover:shadow-lg active:scale-95 ${isSelected ? 'glass-panel border-emerald-400 text-emerald-700 dark:text-emerald-300 shadow-xl shadow-emerald-900/10 dark:shadow-emerald-900/20' : 'bg-white/60 dark:bg-slate-800/40 border-slate-200/50 dark:border-slate-700/50 text-slate-500 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-slate-200'}`}
                      >
                        <div className="flex items-center gap-3">
                          <Icon name="map-location-dot" className={isSelected ? 'text-emerald-500 dark:text-emerald-400 text-lg' : 'text-lg'} />
                          <span className="whitespace-nowrap">{guide.title.substring(0,40)}{guide.title.length > 40 ? '...' : ''}</span>
                        </div>
                      </button>
                    )
                  })}
                </div>
              )}

              {selectedGuide && (
                <div className="space-y-10">
                  {/* Hero Header de la Guía */}
                  <div className={`p-8 md:p-12 rounded-[2.5rem] border shadow-2xl relative overflow-hidden transition-all duration-700 hover:shadow-3xl hover:-translate-y-1 ${isFullyCompleted ? 'bg-gradient-to-br from-emerald-50 to-emerald-100/50 dark:from-slate-800 dark:to-emerald-900/60 border-emerald-300 dark:border-emerald-500/50' : 'glass-panel border-white/40 dark:border-slate-700/50'}`}>
                    <div className="absolute -right-10 -bottom-10 opacity-5 text-slate-900 dark:text-white pointer-events-none transform -rotate-12 transition-all duration-1000 scale-150">
                        <Icon name={isFullyCompleted ? "award" : "map-location-dot"} className="text-[30rem]" />
                    </div>
                    
                    <div className="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-10">
                      <div className="max-w-3xl">
                        <span className={`inline-block px-5 py-2 rounded-xl text-xs font-black uppercase tracking-widest mb-6 border shadow-sm ${isFullyCompleted ? 'bg-emerald-100 dark:bg-emerald-500 text-emerald-700 dark:text-slate-900 border-emerald-300 dark:border-emerald-400' : 'bg-blue-50 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 border-blue-200 dark:border-blue-500/30'}`}>
                          {isFullyCompleted ? 'CERTIFICADO ALCANZADO' : 'Ruta Oficial Obligatoria'}
                        </span>
                        <h1 className="text-4xl md:text-5xl lg:text-6xl font-black text-slate-900 dark:text-white mb-5 leading-tight tracking-tighter">{selectedGuide.title}</h1>
                        <p className="text-slate-600 dark:text-slate-300 text-lg leading-relaxed font-medium max-w-2xl">{selectedGuide.description}</p>
                      </div>
                      
                      <div className="shrink-0 flex items-center justify-center bg-white/80 dark:bg-slate-900/90 p-8 rounded-[2rem] border border-slate-200/50 dark:border-slate-700/80 backdrop-blur-xl shadow-xl dark:shadow-2xl">
                        <div className="text-center">
                            <p className="text-[11px] text-slate-500 dark:text-slate-400 font-black uppercase tracking-widest mb-4">Auditoría de Avance</p>
                            <div className="relative inline-flex items-center justify-center">
                              <svg className="w-32 h-32 transform -rotate-90 filter drop-shadow-sm dark:drop-shadow-lg">
                                <circle cx="64" cy="64" r="56" stroke="currentColor" strokeWidth="10" fill="transparent" className="text-slate-100 dark:text-slate-800" />
                                <circle cx="64" cy="64" r="56" stroke="currentColor" strokeWidth="10" strokeLinecap="round" fill="transparent" strokeDasharray="351.8" strokeDashoffset={351.8 - (351.8 * currentAdoption) / 100} className="text-emerald-500 transition-all duration-[1.5s] ease-out" />
                              </svg>
                              <div className="absolute flex flex-col items-center justify-center">
                                  <span className="text-4xl font-black text-slate-900 dark:text-white tracking-tighter">{currentAdoption}%</span>
                              </div>
                            </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {isFullyCompleted && (
                    <div className="bg-emerald-50 dark:bg-emerald-900/40 border border-emerald-200 dark:border-emerald-500/50 p-6 md:p-10 rounded-3xl flex flex-col md:flex-row items-center gap-8 animate-in zoom-in-95 duration-500 shadow-xl dark:shadow-[0_0_50px_rgba(16,185,129,0.15)] hover:-translate-y-1 transition-transform">
                      <div className="w-24 h-24 bg-white dark:bg-emerald-500/20 rounded-3xl flex items-center justify-center text-emerald-500 dark:text-emerald-400 shrink-0 border border-emerald-100 dark:border-emerald-400/30 shadow-md">
                        <Icon name="medal" className="text-5xl" />
                      </div>
                      <div className="text-center md:text-left">
                        <h4 className="text-emerald-700 dark:text-emerald-400 text-3xl font-black mb-3 tracking-tight">¡Maestría Técnica Acreditada!</h4>
                        <p className="text-emerald-800/80 dark:text-slate-300 font-medium text-lg leading-relaxed max-w-3xl">Has estudiado, analizado y refactorizado todas las temáticas complejas de este programa. Estás listo para enfrentarte a la arquitectura de datos real en proyectos productivos.</p>
                      </div>
                    </div>
                  )}

                  {/* LOOP DE MÓDULOS CON ACORDEÓN */}
                  <div className="space-y-12 mt-12">
                    {selectedGuide.modules.map((module, mIdx) => {
                      let modTotal = module.practices.length;
                      let modCompleted = module.practices.filter(p => {
                          const pData = getPracticeData(progress[currentUser.id]?.[selectedGuide.id]?.[p.id]);
                          return pData.status === 'completed';
                      }).length;
                      const isModuleExpanded = expandedModules[module.id];
                      const isModuleDone = modTotal > 0 && modCompleted === modTotal;
                      
                      const hasActivePractice = module.practices.some(p => p.id === activePracticeId);

                      return (
                        <div key={module.id} className={`relative glass-panel rounded-[2.5rem] p-5 md:p-8 border transition-all duration-500 ${isModuleDone ? 'border-emerald-300 dark:border-emerald-500/30' : (hasActivePractice ? 'border-blue-400 dark:border-emerald-500/60 shadow-[0_0_30px_rgba(16,185,129,0.15)] ring-1 ring-emerald-500/30' : 'border-white/40 dark:border-slate-700/50')} shadow-xl hover:shadow-2xl`}>
                          
                          {/* Botón Encabezado del Módulo */}
                          <div 
                            onClick={() => toggleModuleExpanded(module.id)}
                            className="flex items-center justify-between gap-4 cursor-pointer group select-none p-4 rounded-2xl hover:bg-white/50 dark:hover:bg-slate-800/60 transition-all duration-300"
                          >
                            <div className="flex items-center gap-6">
                              <div className={`w-16 h-16 rounded-2xl flex items-center justify-center font-black text-3xl shadow-sm dark:shadow-md transition-colors shrink-0 border ${isModuleDone ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-500/40' : (hasActivePractice ? 'bg-blue-100 dark:bg-emerald-900/50 text-blue-600 dark:text-emerald-400 border-blue-300 dark:border-emerald-500/50 animate-glow' : 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 group-hover:border-slate-300 dark:group-hover:border-slate-500/50')}`}>
                                {isModuleDone ? <Icon name="check"/> : mIdx + 1}
                              </div>
                              <div className="flex-1">
                                <h3 className={`text-3xl font-extrabold transition-colors tracking-tight ${isModuleDone ? 'text-emerald-700 dark:text-emerald-100' : (hasActivePractice ? 'text-blue-900 dark:text-white' : 'text-slate-700 dark:text-white group-hover:text-blue-600 dark:group-hover:text-emerald-300')}`}>{module.title}</h3>
                                <div className="flex items-center gap-4 mt-3">
                                  <div className="w-40 h-2.5 bg-slate-200 dark:bg-slate-900 rounded-full overflow-hidden border border-slate-300 dark:border-slate-700 shadow-inner">
                                      <div className={`h-full transition-all duration-1000 ease-out ${isModuleDone ? 'bg-emerald-500' : 'bg-blue-500'}`} style={{ width: `${(modCompleted/modTotal)*100}%` }}></div>
                                  </div>
                                  <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">{modCompleted} / {modTotal} TEMAS</span>
                                </div>
                              </div>
                            </div>
                            <div className={`shrink-0 transition-all duration-300 p-4 rounded-2xl shadow-sm dark:shadow-inner ${isModuleDone ? 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-transparent' : 'text-slate-400 dark:text-slate-500 group-hover:text-slate-900 dark:group-hover:text-white bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-transparent group-hover:shadow-md group-hover:scale-105'}`}>
                              <Icon name="chevron-down" className={`icon-rotate text-xl ${isModuleExpanded ? 'expanded' : ''}`} />
                            </div>
                          </div>

                          {/* LOOP DE PRÁCTICAS ANIMADO (Grid Transition) */}
                          <div className={`accordion-content ${isModuleExpanded ? 'expanded mt-6 border-t border-slate-200/80 dark:border-slate-700/50 pt-8' : ''}`}>
                            <div className="accordion-inner space-y-8 pl-2 md:pl-[6.5rem] pr-2 md:pr-4">
                              {module.practices.map((practice) => {
                                const practiceProg = getPracticeData(progress[currentUser.id]?.[selectedGuide.id]?.[practice.id]);
                                const isCompleted = practiceProg.status === 'completed';
                                const isExpanded = expandedPractices[practice.id];
                                const isActiveTask = practice.id === activePracticeId;

                                return (
                                  <div key={practice.id} className={`rounded-3xl border transition-all duration-500 overflow-hidden shadow-sm hover:shadow-lg ${isActiveTask ? 'bg-white dark:bg-slate-800/80 border-blue-400 dark:border-emerald-500/60 ring-2 ring-emerald-500/30 dark:shadow-[0_0_30px_rgba(16,185,129,0.15)] relative scale-[1.01]' : (isCompleted ? 'bg-slate-50/50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 opacity-80 hover:opacity-100' : 'bg-white/90 dark:bg-slate-800/60 border-slate-300 dark:border-slate-600 hover:border-slate-400 dark:hover:border-slate-500')}`}>
                                    
                                    {isActiveTask && (
                                        <div className="absolute top-0 right-0 bg-emerald-500 text-white text-[10px] font-black px-4 py-1.5 rounded-bl-2xl uppercase tracking-widest flex items-center gap-2 shadow-lg z-10">
                                            <span className="w-2 h-2 rounded-full bg-white animate-pulse"></span> 📍 TAREA ACTIVA
                                        </div>
                                    )}

                                    {/* Cabecera de la Práctica */}
                                    <div 
                                      onClick={() => togglePracticeExpanded(practice.id)}
                                      className="flex items-center justify-between p-6 md:p-8 cursor-pointer select-none"
                                    >
                                      <div className="flex items-center gap-5 pr-4">
                                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 border shadow-inner transition-colors duration-500 ${isCompleted ? 'bg-emerald-100 dark:bg-emerald-500/20 border-emerald-300 dark:border-emerald-500/40 text-emerald-600 dark:text-emerald-400' : (practiceProg.status === 'in_progress' ? 'bg-blue-100 dark:bg-blue-500/20 border-blue-300 dark:border-blue-500/40 text-blue-600 dark:text-blue-400 animate-glow' : 'bg-amber-50 dark:bg-amber-500/10 border-amber-200 dark:border-amber-500/30 text-amber-500 dark:text-amber-400')}`}>
                                            {isCompleted ? <Icon name="check" className="text-xl" /> : (practiceProg.status === 'in_progress' ? <Icon name="stopwatch" className="text-xl animate-spin-slow" /> : <Icon name="book-open-reader" className="text-xl" />)}
                                        </div>
                                        <div>
                                            <h4 className={`text-2xl font-bold transition-colors tracking-tight ${isCompleted ? 'text-slate-400 dark:text-slate-500 line-through decoration-slate-300 dark:decoration-slate-700' : (isActiveTask ? 'text-slate-900 dark:text-emerald-50 font-black' : 'text-slate-800 dark:text-slate-100')}`}>
                                              {practice.title}
                                            </h4>
                                            
                                            {/* Subtítulos visuales del estado del tiempo */}
                                            <div className="mt-2 flex items-center gap-4">
                                                {practiceProg.status === 'in_progress' && <span className="text-xs font-black text-blue-600 dark:text-blue-400 uppercase tracking-widest flex items-center gap-1.5"><Icon name="circle-play" className="animate-pulse"/> Cronómetro Corriendo: {formatMsToTime(practiceProg.elapsed + (Date.now() - practiceProg.lastStartedAt))}</span>}
                                                {practiceProg.elapsed > 0 && practiceProg.status !== 'in_progress' && <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center gap-1.5"><Icon name="clock" className="text-slate-400"/> Tiempo invertido: {formatMsToTime(practiceProg.elapsed)}</span>}
                                            </div>
                                        </div>
                                      </div>
                                      <div className={`shrink-0 p-3 rounded-xl transition-colors shadow-sm ${isActiveTask ? 'text-emerald-600 bg-emerald-100 dark:text-emerald-400 dark:bg-slate-800 border border-emerald-200 dark:border-transparent' : 'text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-transparent'}`}>
                                        <Icon name="chevron-down" className={`icon-rotate text-xl ${isExpanded ? 'expanded' : ''}`} />
                                      </div>
                                    </div>

                                    {/* Cuerpo del Detalle Acordeon */}
                                    <div className={`accordion-content ${isExpanded ? 'expanded border-t border-slate-200/80 dark:border-slate-700/50 bg-white/50 dark:bg-slate-900/30' : ''}`}>
                                      <div className="accordion-inner px-6 pb-8 md:pl-[6.5rem] md:pr-8 pt-8">
                                        {/* INYECCIÓN DE MARKDOWN PARSEADO AQUÍ */}
                                        <div 
                                            className="prose"
                                            dangerouslySetInnerHTML={renderSafeMarkdown(practice.details)}
                                        >
                                        </div>
                                        
                                        {/* COMPONENTE DE CRONÓMETRO Y ESTADO */}
                                        <TimerDisplay 
                                            practiceProgress={practiceProg} 
                                            onUpdateStatus={(newStatus) => updatePracticeStatus(selectedGuide.id, practice.id, newStatus)} 
                                        />
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              )}
            </div>
          );
        }

        // --- INICIO DE REACT ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
